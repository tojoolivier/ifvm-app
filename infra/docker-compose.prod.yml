services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ifvm_db}
      POSTGRES_USER: ${POSTGRES_USER:-ifvm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ifvm} -d ${POSTGRES_DB:-ifvm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ifvm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ifvm_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://${DOMAIN}}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # templates de config (jamais modifiés par le runtime)
      - ./nginx.conf.template:/etc/nginx/tmpl/ssl.conf:ro
      - ./nginx-http.conf:/etc/nginx/tmpl/http.conf:ro
      # certificats Let's Encrypt (partagé avec certbot)
      - letsencrypt:/etc/letsencrypt:ro
      # webroot pour le challenge ACME (partagé avec certbot)
      - certbot_webroot:/var/www/certbot:ro
    # Sélectionne HTTP-only ou HTTPS selon la présence du certificat.
    # Le certificat persiste dans le volume Docker "letsencrypt" entre les déploiements.
    command: >
      /bin/sh -c "
        CERT=/etc/letsencrypt/live/$$DOMAIN/fullchain.pem;
        if [ -f $$CERT ]; then
          echo 'Certificat trouvé — démarrage en HTTPS';
          envsubst '$$DOMAIN' < /etc/nginx/tmpl/ssl.conf > /etc/nginx/conf.d/default.conf;
        else
          echo 'Pas de certificat — démarrage en HTTP (ACME challenge prêt)';
          cp /etc/nginx/tmpl/http.conf /etc/nginx/conf.d/default.conf;
        fi;
        nginx -g 'daemon off;'
      "
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # renouvellement automatique toutes les 12h
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped

volumes:
  postgres_data:
  letsencrypt:
  certbot_webroot:
