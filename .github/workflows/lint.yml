name: PR Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-migrations:
    # Parse statique des fichiers de migration : ni Postgres ni env applicatif.
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Historique Alembic lineaire (head unique)
        run: python scripts/check_migration_linearity.py

  replay-migrations:
    # Rejoue toute la chaine 0001..head sur une base vide : attrape ce que le
    # parse statique ne peut pas voir (colonne ajoutee deux fois, contrainte
    # deja posee, migration autogeneree contre une base en derive).
    # "services: postgres" impose un daemon Docker dans le pod -> pool dind.
    runs-on: self-hosted-dind
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ifvm
          POSTGRES_PASSWORD: ifvm_secret
          POSTGRES_DB: ifvm_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ifvm:ifvm_secret@localhost:5432/ifvm_migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: alembic upgrade head sur une base vide
        run: alembic upgrade head

  lint-backend:
    # "services: postgres" impose un daemon Docker dans le pod -> pool dind.
    runs-on: self-hosted-dind
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ifvm
          POSTGRES_PASSWORD: ifvm_secret
          POSTGRES_DB: ifvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  lint-frontend:
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  lint-mobile:
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:schema-drift
      - run: npm test
