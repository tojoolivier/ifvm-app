name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # dorny/paths-filter sur un evenement pull_request retombe sur l'API REST
  # pour lister les fichiers changes (checkout shallow par defaut, pas de
  # diff local possible) : necessite pull-requests: read, absent des
  # permissions par defaut du repo (workflow default = read restrictif).
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Filtre par chemin : evite de solliciter le pool dind (maxRunners=1,
    # partage avec deploy.yml) pour des PR qui ne touchent pas backend/.
    # mobile depend aussi de backend/ : c'est ce qui declenche check:schema-drift
    # (cf. CLAUDE.md, incident colonne "phase" jamais repercutee cote mobile).
    runs-on: self-hosted-linux
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
            frontend:
              - "frontend/**"
            mobile:
              - "mobile/**"
              - "backend/**"

  # Checks rapides (pas de DB, pas de dind) : lint, format, coherence
  # statique des migrations. Tourne en parallele de tests-backend au lieu de
  # le precede : sur le cas nominal (tout passe), attendre le lint avant de
  # lancer pytest n'ajoute que de la latence. Sur une PR qui echoue au lint,
  # ruff est <1s donc le gaspillage de tests-backend est marginal.
  checks-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Historique Alembic lineaire (head unique)
        run: python scripts/check_migration_linearity.py

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  # Rejeu des migrations + pytest : seule la partie qui a reellement besoin
  # de Postgres/Docker occupe le pool dind (maxRunners=1, partage avec
  # deploy.yml) desormais - ruff/format en ont ete sortis (cf. checks-backend).
  tests-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted-dind
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ifvm
          POSTGRES_PASSWORD: ifvm_secret
          POSTGRES_DB: ifvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Libs natives requises par WeasyPrint (rendu PDF, #533) — cf. commentaire du Dockerfile.
      - name: Installe les libs natives de WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libcairo2

      - run: pip install -r requirements-dev.txt

      # Rejeu de la chaine 0001..head sur une base vierge : attrape ce que le
      # parse statique de checks-backend ne peut pas voir (colonne ajoutee
      # deux fois, contrainte deja posee, migration autogeneree contre une base
      # en derive). Base dediee : pytest a la sienne (ifvm_test, cf.
      # tests/conftest.py) et la creerait via ses propres fixtures.
      - name: Cree une base vierge pour le rejeu
        run: |
          python - <<'PY'
          import asyncio

          import asyncpg


          async def main() -> None:
              conn = await asyncpg.connect(
                  "postgresql://ifvm:ifvm_secret@localhost:5432/ifvm_test"
              )
              await conn.execute("DROP DATABASE IF EXISTS ifvm_migrations")
              await conn.execute("CREATE DATABASE ifvm_migrations")
              await conn.close()


          asyncio.run(main())
          PY

      - name: alembic upgrade head sur une base vierge
        env:
          DATABASE_URL: postgresql+asyncpg://ifvm:ifvm_secret@localhost:5432/ifvm_migrations
        run: alembic upgrade head

      # -n 2 volontairement prudent (pas -n auto) : le pod dind est partage/
      # etroit en ressources, cf. l'incident memoire de la suite Jest mobile
      # (jest.config.js) qui a fait perdre la connexion a un runner sous
      # charge. A ajuster seulement avec des metriques de charge du pod.
      - run: pytest -n 2

  # Gatekeeper : "backend" est le required status check nomme sur main
  # (branch protection) — pas "lint-backend" (cf. #ci-check-requis-desaligne :
  # un renommage anterieur des jobs, jamais reporte sur la protection de
  # branche, laissait ce check bloque indefiniment sur "waiting for status to
  # be reported"). Tourne toujours, sur self-hosted-linux (pas de cout dind),
  # et relaie le resultat des deux jobs ci-dessus quand backend/ a change.
  backend:
    needs: [changes, checks-backend, tests-backend]
    if: always()
    runs-on: self-hosted-linux
    steps:
      - name: Verifie le resultat de checks-backend et tests-backend
        run: |
          if [[ "${{ needs.changes.outputs.backend }}" == "true" ]]; then
            if [[ "${{ needs.checks-backend.result }}" != "success" || "${{ needs.tests-backend.result }}" != "success" ]]; then
              echo "checks-backend=${{ needs.checks-backend.result }} tests-backend=${{ needs.tests-backend.result }}"
              exit 1
            fi
          fi
          echo "OK (backend modifie: ${{ needs.changes.outputs.backend }}, checks: ${{ needs.checks-backend.result }}, tests: ${{ needs.tests-backend.result }})"

  checks-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  tests-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test

  # Gatekeeper, meme raison que "backend" ci-dessus.
  frontend:
    needs: [changes, checks-frontend, tests-frontend]
    if: always()
    runs-on: self-hosted-linux
    steps:
      - name: Verifie le resultat de checks-frontend et tests-frontend
        run: |
          if [[ "${{ needs.changes.outputs.frontend }}" == "true" ]]; then
            if [[ "${{ needs.checks-frontend.result }}" != "success" || "${{ needs.tests-frontend.result }}" != "success" ]]; then
              echo "checks-frontend=${{ needs.checks-frontend.result }} tests-frontend=${{ needs.tests-frontend.result }}"
              exit 1
            fi
          fi
          echo "OK (frontend modifie: ${{ needs.changes.outputs.frontend }}, checks: ${{ needs.checks-frontend.result }}, tests: ${{ needs.tests-frontend.result }})"

  checks-mobile:
    # Se declenche aussi sur backend/** (pas seulement mobile/**) : c'est ce
    # job qui porte check:schema-drift, le garde-fou contre une derive entre
    # le schema backend et le cache SQLite mobile (cf. CLAUDE.md).
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:schema-drift

  # 3 legs au lieu d'un seul "npm test" : la suite jest-expo ("screens", 114
  # fichiers vs 55 pour "logic") est le facteur limitant et le projet identifie
  # comme gourmand en memoire (cf. jest.config.js, maxWorkers:2 volontairement
  # bas suite a un OOM-kill de runner). On parallelise par JOB (plus de
  # runners), pas par worker (plus de memoire par runner) - meme profil
  # memoire par job qu'avant, juste plus de jobs en vol.
  tests-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: mobile
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: logic
            jest_args: --selectProjects logic
          - shard: screens-1
            jest_args: --selectProjects screens --shard=1/2
          - shard: screens-2
            jest_args: --selectProjects screens --shard=2/2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm test -- ${{ matrix.jest_args }}

  # Gatekeeper, meme raison que "backend" ci-dessus.
  mobile:
    needs: [changes, checks-mobile, tests-mobile]
    if: always()
    runs-on: self-hosted-linux
    steps:
      - name: Verifie le resultat de checks-mobile et tests-mobile
        run: |
          if [[ "${{ needs.changes.outputs.mobile }}" == "true" ]]; then
            if [[ "${{ needs.checks-mobile.result }}" != "success" || "${{ needs.tests-mobile.result }}" != "success" ]]; then
              echo "checks-mobile=${{ needs.checks-mobile.result }} tests-mobile=${{ needs.tests-mobile.result }}"
              exit 1
            fi
          fi
          echo "OK (mobile/backend modifie: ${{ needs.changes.outputs.mobile }}, checks: ${{ needs.checks-mobile.result }}, tests: ${{ needs.tests-mobile.result }})"
