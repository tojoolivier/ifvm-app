name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # dorny/paths-filter sur un evenement pull_request retombe sur l'API REST
  # pour lister les fichiers changes (checkout shallow par defaut, pas de
  # diff local possible) : necessite pull-requests: read, absent des
  # permissions par defaut du repo (workflow default = read restrictif).
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Filtre par chemin : evite de solliciter le pool dind (maxRunners=1,
    # partage avec deploy.yml) pour des PR qui ne touchent pas backend/.
    # mobile depend aussi de backend/ : c'est ce qui declenche check:schema-drift
    # (cf. CLAUDE.md, incident colonne "phase" jamais repercutee cote mobile).
    runs-on: self-hosted-linux
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
            frontend:
              - "frontend/**"
            mobile:
              - "mobile/**"
              - "backend/**"

  check-migrations:
    # Parse statique des fichiers de migration : ni Postgres ni env applicatif.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Historique Alembic lineaire (head unique)
        run: python scripts/check_migration_linearity.py

  lint-backend-impl:
    # Porte aussi le rejeu des migrations : le pool dind est plafonne a
    # maxRunners=1 (runner-scale-set-dind.yaml), donc deux jobs dind dans ce
    # workflow se serialisent au lieu de tourner en parallele.
    # "services: postgres" impose un daemon Docker dans le pod -> pool dind.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted-dind
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ifvm
          POSTGRES_PASSWORD: ifvm_secret
          POSTGRES_DB: ifvm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      # Rejeu de la chaine 0001..head sur une base vierge : attrape ce que le
      # parse statique de check-migrations ne peut pas voir (colonne ajoutee
      # deux fois, contrainte deja posee, migration autogeneree contre une base
      # en derive). Base dediee : pytest a la sienne (ifvm_test, cf.
      # tests/conftest.py) et la creerait via ses propres fixtures.
      - name: Cree une base vierge pour le rejeu
        run: |
          python - <<'PY'
          import asyncio

          import asyncpg


          async def main() -> None:
              conn = await asyncpg.connect(
                  "postgresql://ifvm:ifvm_secret@localhost:5432/ifvm_test"
              )
              await conn.execute("DROP DATABASE IF EXISTS ifvm_migrations")
              await conn.execute("CREATE DATABASE ifvm_migrations")
              await conn.close()


          asyncio.run(main())
          PY

      - name: alembic upgrade head sur une base vierge
        env:
          DATABASE_URL: postgresql+asyncpg://ifvm:ifvm_secret@localhost:5432/ifvm_migrations
        run: alembic upgrade head

      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Gatekeeper : "lint-backend" est un required status check nomme sur main
  # (branch protection). Un skip via `if:` sur ce nom ferait rester le check
  # "expected" indefiniment et bloquerait le merge. Ce job tourne donc
  # toujours, sur self-hosted-linux (pas de cout dind), et se contente de
  # relayer le resultat de lint-backend-impl quand backend/ a change.
  lint-backend:
    needs: [changes, lint-backend-impl]
    if: always()
    runs-on: self-hosted-linux
    steps:
      - name: Verifie le resultat de lint-backend-impl
        run: |
          if [[ "${{ needs.changes.outputs.backend }}" == "true" && "${{ needs.lint-backend-impl.result }}" != "success" ]]; then
            echo "lint-backend-impl a echoue ou ne s'est pas termine (result=${{ needs.lint-backend-impl.result }})"
            exit 1
          fi
          echo "OK (backend modifie: ${{ needs.changes.outputs.backend }}, resultat impl: ${{ needs.lint-backend-impl.result }})"

  lint-frontend-impl:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Gatekeeper, meme raison que lint-backend ci-dessus.
  lint-frontend:
    needs: [changes, lint-frontend-impl]
    if: always()
    runs-on: self-hosted-linux
    steps:
      - name: Verifie le resultat de lint-frontend-impl
        run: |
          if [[ "${{ needs.changes.outputs.frontend }}" == "true" && "${{ needs.lint-frontend-impl.result }}" != "success" ]]; then
            echo "lint-frontend-impl a echoue ou ne s'est pas termine (result=${{ needs.lint-frontend-impl.result }})"
            exit 1
          fi
          echo "OK (frontend modifie: ${{ needs.changes.outputs.frontend }}, resultat impl: ${{ needs.lint-frontend-impl.result }})"

  lint-mobile-impl:
    # Se declenche aussi sur backend/** (pas seulement mobile/**) : c'est ce
    # job qui porte check:schema-drift, le garde-fou contre une derive entre
    # le schema backend et le cache SQLite mobile (cf. CLAUDE.md).
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: self-hosted-linux
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:schema-drift
      - run: npm test

  # Gatekeeper, meme raison que lint-backend ci-dessus.
  lint-mobile:
    needs: [changes, lint-mobile-impl]
    if: always()
    runs-on: self-hosted-linux
    steps:
      - name: Verifie le resultat de lint-mobile-impl
        run: |
          if [[ "${{ needs.changes.outputs.mobile }}" == "true" && "${{ needs.lint-mobile-impl.result }}" != "success" ]]; then
            echo "lint-mobile-impl a echoue ou ne s'est pas termine (result=${{ needs.lint-mobile-impl.result }})"
            exit 1
          fi
          echo "OK (mobile/backend modifie: ${{ needs.changes.outputs.mobile }}, resultat impl: ${{ needs.lint-mobile-impl.result }})"
