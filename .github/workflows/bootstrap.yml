name: Bootstrap VPS

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installer la deploy key git sur la VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VPS_DEPLOY_KEY
          script: |
            mkdir -p /root/.ssh
            echo "$VPS_DEPLOY_KEY" > /root/.ssh/id_ed25519
            chmod 600 /root/.ssh/id_ed25519
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Copier le script bootstrap sur la VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/bootstrap-vps.sh
          target: /tmp/

      - name: Lancer le bootstrap
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOMAIN,POSTGRES_PASSWORD,JWT_SECRET
          script: bash /tmp/scripts/bootstrap-vps.sh
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
