name: Renovate

on:
  schedule:
    - cron: "0 3 * * 1" # tous les lundis à 3h UTC
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-hosted Renovate
        # Ce dépôt d'action ne publie pas de tag majeur flottant (`v46` n'existe pas) :
        # il faut épingler une version complète, que Renovate mettra à jour lui-même.
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
