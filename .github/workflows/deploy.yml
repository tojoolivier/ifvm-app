name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ifvm-app-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ifvm-app-frontend

jobs:
  changes:
    # Filtre par chemin : un push mobile-only (frequent) ne doit pas
    # solliciter le pool dind pour rebuild des images backend/frontend
    # inchangees.
    runs-on: self-hosted-linux
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
            frontend:
              - "frontend/**"

  build-and-push:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    # docker/build-push-action impose un daemon Docker dans le pod -> pool dind.
    runs-on: self-hosted-dind
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-manifests:
    needs: [changes, build-and-push]
    if: needs.build-and-push.result == 'success'
    runs-on: self-hosted-linux
    steps:
      - name: Checkout infra-k8s
        uses: actions/checkout@v4
        with:
          repository: tojoolivier/infra-k8s
          ssh-key: ${{ secrets.INFRA_REPO_DEPLOY_KEY }}

      - name: Bump image tags
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          if [[ "${{ needs.changes.outputs.backend }}" == "true" ]]; then
            sed -i "s|image: ghcr.io/tojoolivier/ifvm-app-backend:.*|image: ghcr.io/tojoolivier/ifvm-app-backend:${TAG}|" \
              clusters/production/apps/ifvm-app/manifests/backend.yaml
          fi
          if [[ "${{ needs.changes.outputs.frontend }}" == "true" ]]; then
            sed -i "s|image: ghcr.io/tojoolivier/ifvm-app-frontend:.*|image: ghcr.io/tojoolivier/ifvm-app-frontend:${TAG}|" \
              clusters/production/apps/ifvm-app/manifests/frontend.yaml
          fi

      - name: Commit and push
        run: |
          git config user.name "ifvm-app-ci"
          git config user.email "ci@ifvm-app"
          if git diff --quiet; then
            echo "No manifest changes to deploy"
            exit 0
          fi
          git commit -am "Deploy ifvm-app ${{ needs.build-and-push.outputs.tag }}"
          git push
