name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ifvm-app-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ifvm-app-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra-k8s
        uses: actions/checkout@v4
        with:
          repository: tojoolivier/infra-k8s
          ssh-key: ${{ secrets.INFRA_REPO_DEPLOY_KEY }}

      - name: Bump image tags
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          sed -i "s|image: ghcr.io/tojoolivier/ifvm-app-backend:.*|image: ghcr.io/tojoolivier/ifvm-app-backend:${TAG}|" \
            clusters/production/apps/ifvm-app/manifests/backend.yaml
          sed -i "s|image: ghcr.io/tojoolivier/ifvm-app-frontend:.*|image: ghcr.io/tojoolivier/ifvm-app-frontend:${TAG}|" \
            clusters/production/apps/ifvm-app/manifests/frontend.yaml

      - name: Commit and push
        run: |
          git config user.name "ifvm-app-ci"
          git config user.email "ci@ifvm-app"
          if git diff --quiet; then
            echo "No manifest changes to deploy"
            exit 0
          fi
          git commit -am "Deploy ifvm-app ${{ needs.build-and-push.outputs.tag }}"
          git push
