name: Deploy to Production

on:
  push:
    branches: [main]

env:
  APP_DIR: /opt/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOMAIN,POSTGRES_PASSWORD,JWT_SECRET
          script: |
            cd ${{ env.APP_DIR }}

            # Mettre à jour le .env depuis les secrets GitHub
            cat > .env <<EOF
            POSTGRES_DB=ifvm_db
            POSTGRES_USER=ifvm
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            JWT_ALGORITHM=HS256
            JWT_EXPIRE_MINUTES=60
            VITE_API_URL=http://${DOMAIN}
            EOF

            GIT_SSH_COMMAND="ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no" git pull origin main
            docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
            docker compose -f infra/docker-compose.prod.yml --env-file .env exec -T backend alembic upgrade head
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
