name: Mobile build (EAS preview/production, local)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  # Detecte si le push touche mobile/** (le trigger n'est plus filtre par chemin au
  # niveau du workflow, car un tag de release doit declencher le build production
  # meme quand le tag ne touche pas mobile/**) et, parmi les changements mobile,
  # si c'est du natif (deps, config Expo) ou seulement du JS/TS.
  # JS/TS seul -> update OTA (secondes) ; natif -> build APK complet sur le runner self-hoste.
  changes:
    if: github.ref_type == 'branch'
    runs-on: self-hosted-linux
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - "mobile/**"
            native:
              - "mobile/package.json"
              - "mobile/package-lock.json"
              - "mobile/app.json"
              - "mobile/eas.json"

  # Pas de job de test ici : main est protegee (squash-merge apres checks
  # verts, cf. branch protection), donc le code qui arrive sur main a deja
  # ete valide par mobile (checks-mobile + tests-mobile) dans lint.yml en PR.
  # Relancer npm test ici serait redondant sur un contenu deja teste.

  # Publication OTA (expo-updates) pour les changements JS/TS purs : les apps installees
  # recuperent la mise a jour au prochain lancement, sans rebuild natif ni re-installation.
  # runtimeVersion "fingerprint" garantit qu'une update n'atteint que les binaires compatibles.
  ota-update:
    needs: changes
    if: github.ref_type == 'branch' && needs.changes.outputs.mobile == 'true' && needs.changes.outputs.native != 'true'
    runs-on: self-hosted-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Publish OTA update (channel preview)
        env:
          # Via env var et non interpole dans le script : un message de commit contenant
          # des guillemets/backticks serait sinon execute par le shell (script injection).
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          # eas.json "env" ne s'applique qu'aux builds natifs (eas build), pas aux OTA
          # (eas update) : sans cette variable ici, le bundle JS republie est fige avec
          # EXPO_PUBLIC_API_URL=undefined et l'app retombe sur le fallback localhost:8000
          # (mobile/src/lib/api-client.ts) pour tous les utilisateurs du canal preview.
          EXPO_PUBLIC_API_URL: https://ifvm.orakotondravao.com/api
        run: eas update --channel preview --message "$COMMIT_MSG" --non-interactive

  build:
    needs: changes
    # Build natif complet uniquement si necessaire (changement natif ou declenchement manuel)
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'branch' && needs.changes.outputs.native == 'true')
    # Runner self-hoste (ARC) : JDK 17 + Android SDK/NDK deja preinstalles dans l'image,
    # voir infra-k8s/clusters/production/infrastructure/actions-runner-controller.
    # Remplace le detour "EAS local build sur ubuntu-latest" (workaround quota EAS Build
    # cloud, cf. commentaire plus bas) par une solution permanente qui ne consomme aucun quota.
    runs-on: android-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Cache Gradle : volume Longhorn monte directement sur le runner (pas de
      # actions/cache — evite l'aller-retour reseau, voir infra-k8s/.../gradle-cache-pvc.yaml)
      #
      # Le volume ne cachait jusqu'ici que modules-2 (telechargement des dependances).
      # org.gradle.caching active en plus le cache de SORTIES de taches (build-cache-1,
      # lui aussi sur le volume) : classes compilees, dex, etc. sont reutilisees d'un run
      # a l'autre au lieu d'etre recalculees. Ecrit dans GRADLE_USER_HOME, qui a la
      # priorite sur le android/gradle.properties genere par prebuild.
      #
      # org.gradle.parallel volontairement NON active : le build a deja atteint 8.1Gi
      # sur une limite de 9Gi, et paralleliser les modules augmente le pic memoire —
      # on a deja subi un OOM kill silencieux a 6Gi. A reconsiderer si la limite monte.
      #
      # Depuis l'ajout de armeabi-v7a a buildArchs (support itel A631L / Unisoc
      # SC9863A, cf. ADR-004), le build compile 3 ABI au lieu de 2 : la DUREE
      # augmente d'environ 50%, le pic memoire beaucoup moins (AGP enchaine les
      # ABI sequentiellement tant que org.gradle.parallel reste desactive).
      # Si un OOM reapparait, retirer x86_64 (emulateur uniquement) avant de
      # toucher aux ABI ARM : elles conditionnent l'installabilite sur le terrain.
      - name: Enable Gradle task-output cache (persisted on the runner volume)
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.caching=true\n' > "$HOME/.gradle/gradle.properties"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm # l'action installe eas-cli avec yarn par defaut ; absent de l'image runner, et le repo n'utilise pas yarn (package-lock.json)

      # Build local sur le runner self-hoste : ne consomme plus le quota EAS Build cloud,
      # remplace le workaround temporaire precedent (reset de quota prevu le 2026-09-01).
      #
      # EAS_LOCAL_BUILD_WORKINGDIR place le workspace de build sur LE MEME systeme de
      # fichiers que le cache Gradle (le volume Longhorn). Par defaut il atterrit dans
      # /tmp (overlayfs du conteneur) : les hard links vers les .so prefab du cache
      # echouent alors entre systemes de fichiers et AGP retombe sur une copie complete
      # ("Hard link ... failed. Doing a slower copy instead" dans les logs), pour chaque
      # libreactnative.so, par ABI et par module natif — depuis un volume replique reseau.
      - name: Build Android preview locally (EAS local build)
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: /home/runner/.gradle/easwork
        run: |
          # Le workingdir vit sur le volume Longhorn PERSISTANT : un run annule ou
          # interrompu y laisse son workspace, et "eas build --local" refuse alors de
          # demarrer ("Error: Workingdir is not empty."). C'est ce qui a fait echouer le
          # build du 2026-08-24 puis publier 5 updates OTA sur un fingerprint sans APK.
          # On repart donc d'un repertoire vide a chaque run (le cache Gradle lui-meme
          # est ailleurs dans GRADLE_USER_HOME et n'est pas touche).
          rm -rf "$EAS_LOCAL_BUILD_WORKINGDIR"
          mkdir -p "$EAS_LOCAL_BUILD_WORKINGDIR"
          eas build --platform android --profile preview --local --non-interactive --output ./ifvm-preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ifvm-preview-apk
          path: mobile/ifvm-preview.apk
          retention-days: 14

  # Build production sur tag de release (v*), inconditionnellement — pas de path-filter
  # comme pour "changes" : un tag est un evenement rare et volontaire, le cout d'un build
  # Android inutile occasionnel est negligeable face a la complexite d'un diff inter-tags.
  # Meme profil "production" (mobile/eas.json) que celui deja utilise si l'app est
  # publiee sur un store : APK release, pas de soumission automatique (eas submit) —
  # l'artifact est uploade pour installation/verification manuelle, geste de publication
  # au store laisse volontairement humain.
  build-production:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: android-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Enable Gradle task-output cache (persisted on the runner volume)
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.caching=true\n' > "$HOME/.gradle/gradle.properties"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build Android production locally (EAS local build)
        env:
          # Workingdir distinct de celui du job "build" (profil preview) : les deux
          # peuvent tourner en parallele sur le meme pool de runners self-hostes
          # ("android-build") pour des refs differentes (branche main vs tag).
          EAS_LOCAL_BUILD_WORKINGDIR: /home/runner/.gradle/easwork-production
        run: |
          rm -rf "$EAS_LOCAL_BUILD_WORKINGDIR"
          mkdir -p "$EAS_LOCAL_BUILD_WORKINGDIR"
          eas build --platform android --profile production --local --non-interactive --output ./ifvm-production.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ifvm-production-apk
          path: mobile/ifvm-production.apk
          retention-days: 90
