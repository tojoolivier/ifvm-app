name: Mobile build (EAS preview, local)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Build local en attendant le renouvellement du quota EAS Build cloud (reset 2026-09-01).
      # Revenir à `eas build --platform android --profile preview --non-interactive --no-wait` ensuite.
      - name: Build Android preview locally (EAS local build)
        run: eas build --platform android --profile preview --local --non-interactive --output ./ifvm-preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ifvm-preview-apk
          path: mobile/ifvm-preview.apk
          retention-days: 14
