name: Mobile build (EAS preview, local)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  workflow_dispatch: {}

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm test

  build:
    needs: test
    # Runner self-hoste (ARC) : JDK 17 + Android SDK/NDK deja preinstalles dans l'image,
    # voir infra-k8s/clusters/production/infrastructure/actions-runner-controller.
    # Remplace le detour "EAS local build sur ubuntu-latest" (workaround quota EAS Build
    # cloud, cf. commentaire plus bas) par une solution permanente qui ne consomme aucun quota.
    runs-on: android-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            gradle-

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Build local sur le runner self-hoste : ne consomme plus le quota EAS Build cloud,
      # remplace le workaround temporaire precedent (reset de quota prevu le 2026-09-01).
      - name: Build Android preview locally (EAS local build)
        run: eas build --platform android --profile preview --local --non-interactive --output ./ifvm-preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ifvm-preview-apk
          path: mobile/ifvm-preview.apk
          retention-days: 14
