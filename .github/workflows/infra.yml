name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action Terraform'
        required: true
        type: choice
        default: 'apply'
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

env:
  TF_VAR_client_id: ${{ secrets.CONTABO_CLIENT_ID }}
  TF_VAR_client_secret: ${{ secrets.CONTABO_CLIENT_SECRET }}
  TF_VAR_api_user: ${{ secrets.CONTABO_API_USER }}
  TF_VAR_api_password: ${{ secrets.CONTABO_API_PASSWORD }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_domain: ${{ vars.DOMAIN }}
  TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/contabo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10"

      - name: Terraform Format
        run: terraform fmt -check -diff -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Determine action
        id: action
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "cmd=plan" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cmd=${{ inputs.action }}" >> $GITHUB_OUTPUT
          else
            echo "cmd=apply" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Plan
        id: plan
        if: steps.action.outputs.cmd != 'destroy'
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee tfplan.txt
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$(tail -n 5 tfplan.txt)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        if: steps.action.outputs.cmd == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Destroy
        if: steps.action.outputs.cmd == 'destroy'
        run: terraform destroy -input=false -auto-approve

      - name: PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/contabo/tfplan.txt', 'utf8').substring(0, 60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform Plan\n```hcl\n' + plan + '\n```'
            });
